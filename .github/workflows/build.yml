name: Build Click Package

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y click wget tar xz-utils bzip2 curl jq

      - name: Inspect build folder and docs
        run: |
          ls -la build/ click/
          cat BUILD.md

      - name: Build click package
        run: |
          for script in build/*.sh; do
            if [ -f "$script" ]; then
              chmod +x "$script"
              ./"$script"
            fi
          done
          if [ -z "$(find . -name '*.click')" ]; then
            click build click/
          fi

      - name: Upload click artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-ut-arm64
          path: "**/*.click"
