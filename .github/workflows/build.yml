name: Build Click Package

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install click tool
        run: |
          sudo apt-get update
          sudo apt-get install -y click

      - name: Prepare and build click package
        run: |
          ls -la
          mkdir -p /tmp/build_dir
          cp -r * /tmp/build_dir/
          cd /tmp/build_dir
          for script in *.sh; do
            if [ -f "$script" ]; then
              chmod +x "$script"
              ./"$script"
            fi
          done
          cd "$GITHUB_WORKSPACE"
          click build /tmp/build_dir

      - name: Upload click artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-ut-arm64
          path: "*.click"
